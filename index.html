<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS & Voortgangsmonitor</title>
    
    <!-- PWA Web App Manifest direct gekoppeld -->
    <meta name="theme-color" content="#0F172A">
    <link rel="manifest" href="data:application/manifest+json,{
        &quot;name&quot;: &quot;MS Voortgangsmonitor&quot;,
        &quot;short_name&quot;: &quot;MS-Vita&quot;,
        &quot;start_url&quot;: &quot;./index.html&quot;,
        &quot;display&quot;: &quot;standalone&quot;,
        &quot;background_color&quot;: &quot;#0F172A&quot;,
        &quot;theme_color&quot;: &quot;#0F172A&quot;,
        &quot;icons&quot;: [
            {
                &quot;src&quot;: &quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230F172A'/%3E%3Ctext x='50%25' y='50%25' font-size='220' fill='%23FFF' dominant-baseline='middle' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E&quot;,
                &quot;sizes&quot;: &quot;512x512&quot;,
                &quot;type&quot;: &quot;image/svg+xml&quot;
            }
        ]
    }">

    <!-- Chart.js bibliotheek voor offline grafieken -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --text-color: #F8FAFC;
            --accent: #38BDF8;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: var(--bg-color);
            border-color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 16px;
        }

        .hidden {
            display: none;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #94A3B8;
        }

        input, select, textarea {
            width: 100%;
            background-color: #0F172A;
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-label input {
            width: auto;
            margin-bottom: 0;
        }

        .med-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .med-input-group input {
            margin-bottom: 0;
        }

        .med-input-group button {
            width: auto;
            padding: 0 16px;
            background-color: var(--border);
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .med-input-group button:hover {
            background-color: #475569;
        }

        button.action-btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 4px;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>MS & Voortgangsmonitor</h1>
        <span>PWA</span>
    </header>

    <!-- Navigatie Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="btn-form" onclick="switchTab('form')">Dagboek</button>
        <button class="tab-btn" id="btn-charts" onclick="switchTab('charts')">Grafieken</button>
    </div>

    <!-- Tab 1: Formulier / Dagboek -->
    <div class="card" id="section-form">
        <label for="entry-date">Datum:</label>
        <input type="date" id="entry-date">

        <label for="daily-status">Algemene Dagstatus:</label>
        <select id="daily-status">
            <option value="Goed">Goed (Weinig klachten)</option>
            <option value="Matig">Matig</option>
            <option value="Slecht">Slecht (Veel klachten)</option>
        </select>

        <label for="fatigue-level">Vermoeidheid (1 = Minimaal, 5 = Extreem):</label>
        <select id="fatigue-level">
            <option value="1">1 - Minimaal</option>
            <option value="2">2 - Licht</option>
            <option value="3" selected>3 - Matig</option>
            <option value="4">4 - Hoog</option>
            <option value="5">5 - Extreem</option>
        </select>

        <label>Specifieke Klachten / Symptomen:</label>
        <div class="checkbox-grid">
            <label class="checkbox-label"><input type="checkbox" value="Tintelingen"> Tintelingen / Gevoelloos</label>
            <label class="checkbox-label"><input type="checkbox" value="Spierstijfheid"> Spierstijfheid / Spasmen</label>
            <label class="checkbox-label"><input type="checkbox" value="Balans"> Balans / Coördinatie</label>
            <label class="checkbox-label"><input type="checkbox" value="Brain fog"> Brain fog / Focus</label>
            <label class="checkbox-label"><input type="checkbox" value="Zichtproblemen"> Zichtproblemen</label>
            <label class="checkbox-label"><input type="checkbox" value="Warmtegevoelig"> Warmtegevoelig (Uthoff)</label>
        </div>

        <label>Medicatie / Supplementen:</label>
        <div class="med-input-group">
            <input type="text" id="new-med-name" placeholder="Nieuwe medicatie toevoegen...">
            <button type="button" onclick="addMedicationOption()">Voeg toe</button>
        </div>
        <div class="checkbox-grid" id="medications-container">
            <!-- Dynamische medicatievinkjes komen hier -->
        </div>

        <label for="notes">Notities (Triggers, slaap, etc.):</label>
        <textarea id="notes" rows="3" placeholder="Bijv. slechte nachtrust, warm weer, drukke dag..."></textarea>

        <button class="action-btn" onclick="saveEntry()">Sla Dag op</button>
    </div>

    <!-- Tab 2: Grafieken -->
    <div class="card hidden" id="section-charts">
        <h2 style="font-size: 1.2rem; margin-top: 0; color: var(--accent);">Voortgang over tijd</h2>
        <p style="font-size: 0.85rem; color: #94A3B8; margin-bottom: 16px;">Hier zie je de opgeslagen vermoeidheid en statusontwikkeling.</p>
        
        <div style="position: relative; height: 250px; width: 100%;">
            <canvas id="progressChart"></canvas>
        </div>
    </div>

    <script>
        // Automatisch de huidige datum instellen
        document.getElementById('entry-date').valueAsDate = new Date();

        // Standaard medicatielijst of ophalen uit localStorage
        let customMeds = JSON.parse(localStorage.getItem('ms_vita_meds') || '["Vitamine D", "Tecfidera", "Baclofen"]');

        function renderMedications() {
            const container = document.getElementById('medications-container');
            container.innerHTML = '';
            customMeds.forEach(med => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                label.innerHTML = `<input type="checkbox" value="${med}" class="med-checkbox"> ${med}`;
                container.appendChild(label);
            });
        }

        function addMedicationOption() {
            const input = document.getElementById('new-med-name');
            const medName = input.value.trim();
            if (medName && !customMeds.includes(medName)) {
                customMeds.push(medName);
                localStorage.setItem('ms_vita_meds', JSON.stringify(customMeds));
                input.value = '';
                renderMedications();
            }
        }

        // Initialiseer medicatie bij laden
        renderMedications();

        function switchTab(tabName) {
            const formSection = document.getElementById('section-form');
            const chartsSection = document.getElementById('section-charts');
            const btnForm = document.getElementById('btn-form');
            const btnCharts = document.getElementById('btn-charts');

            if (tabName === 'form') {
                formSection.classList.remove('hidden');
                chartsSection.classList.add('hidden');
                btnForm.classList.add('active');
                btnCharts.classList.remove('active');
            } else {
                formSection.classList.add('hidden');
                chartsSection.classList.remove('hidden');
                btnCharts.classList.add('active');
                btnForm.classList.remove('active');
                loadChartData();
            }
        }

        function saveEntry() {
            // Verzamel aangevinkte symptomen
            const symptoms = Array.from(document.querySelectorAll('.checkbox-grid input[type="checkbox"]:checked'))
                .map(cb => cb.value);

            // Verzamel aangevinkte medicatie
            const usedMeds = Array.from(document.querySelectorAll('.med-checkbox:checked'))
                .map(cb => cb.value);

            const entry = {
                date: document.getElementById('entry-date').value,
                status: document.getElementById('daily-status').value,
                fatigue: document.getElementById('fatigue-level').value,
                symptoms: symptoms,
                medications: usedMeds,
                notes: document.getElementById('notes').value
            };

            let entries = JSON.parse(localStorage.getItem('ms_vita_entries') || '[]');
            entries.push(entry);
            localStorage.setItem('ms_vita_entries', JSON.stringify(entries));

            alert('Dag succesvol opgeslagen!');
        }

        let myChart = null;

        function loadChartData() {
            const entries = JSON.parse(localStorage.getItem('ms_vita_entries') || '[]');
            
            // Sorteer op datum
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));

            const labels = entries.map(e => e.date);
            const fatigueData = entries.map(e => parseInt(e.fatigue));

            const ctx = document.getElementById('progressChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Vermoeidheid (1-5)',
                        data: fatigueData,
                        borderColor: '#38BDF8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 5,
                            ticks: { stepSize: 1, color: '#94A3B8' },
                            grid: { color: '#334155' }
                        },
                        x: {
                            ticks: { color: '#94A3B8' },
                            grid: { color: '#334155' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#F8FAFC' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
